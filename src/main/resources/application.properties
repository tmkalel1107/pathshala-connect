spring.application.name=Pathshala Connect

# =======================================================
# MySQL Database Configuration
# =======================================================
# To change MySQL credentials, update below or set environment variables:
# MYSQL_USER and MYSQL_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/pathshala_connect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Tushar@5436}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================================================
# JPA / Hibernate Configuration
# =======================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =======================================================
# Internationalization (i18n) Configuration
# Default language: Marathi (mr), secondary: English (en)
# =======================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# =======================================================
# Thymeleaf & Web
# =======================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =======================================================
# Server Configuration
# =======================================================
server.port=8080
server.error.whitelabel.enabled=false

# =======================================================
# Admin Security Configuration
# Passcode required for public admin registration
# =======================================================
pathshala.admin.secret-key=${ADMIN_SECRET:PATHSHALA_ADMIN_2026}
