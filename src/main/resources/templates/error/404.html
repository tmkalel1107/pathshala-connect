<!doctype html>
<html lang="mr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{error.404.title})}"></head>
<body>
<div th:replace="~{fragments/navbar :: nav}"></div>

<main class="page error-page">
  <div class="container text-center py-5">
    <div class="error-visual">🔍</div>
    <h1 class="error-code">404</h1>
    <h2 class="error-title" th:text="#{error.404.title}">पान सापडले नाही</h2>
    <p class="error-lead text-muted" th:text="#{error.404.desc}">
      तुम्ही शोधत असलेले पान अस्तित्वात नाही किंवा हलवण्यात आले आहे.
    </p>
    <div class="error-actions mt-4">
      <a href="/" class="btn btn-primary btn-lg" th:text="#{nav.home}">मुख्यपृष्ठ</a>
      <a href="/schools" class="btn btn-outline btn-lg" th:text="#{nav.schools}">शाळा निर्देशिका</a>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: foot}"></div>
<script src="/js/app.js"></script>
</body>
</html>
